<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dice Depths">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Dice Depths</title>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="stat" id="goldstat"><span>🪙</span><b id="gold">0</b><small id="gps"></small></div>
    <div class="stat chips"><span>🎰</span><b id="chips">0</b></div>
  </header>

  <main id="play">
    <nav id="games"></nav>
    <section id="stage">
      <div id="buffs"></div>
      <div id="combo"></div>
      <div id="table"></div>
      <div id="payout"></div>
      <div id="info"></div>
    </section>
    <div id="controls">
      <button id="go">ROLL</button>
      <button id="autobtn" hidden>AUTO<small>ON</small></button>
    </div>
  </main>

  <aside id="panel">
    <nav id="tabs">
      <button data-tab="tree" class="on">Upgrades</button>
      <button data-tab="perm">Prestige</button>
      <button data-tab="hilo">Hi-Lo</button>
      <button data-tab="cfg" aria-label="Settings">⚙</button>
    </nav>
    <div id="sheet"></div>
  </aside>
</div>

<canvas id="fx"></canvas>
<div id="modal" hidden><div class="card" id="modalcard"></div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
